name: Paper bank checks
on:
  pull_request:
    paths: ['bank/**', '.github/workflows/bank-checks.yml']
  push:
    paths: ['bank/**', '.github/workflows/bank-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bank/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
