name: Study Vault v2 checks
on:
  pull_request:
    paths: ['v2/**', '.github/workflows/v2-checks.yml']
  push:
    paths: ['v2/**', '.github/workflows/v2-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Hosted browser smoke tests run separately with TEST_BASE_URL after deployment.
